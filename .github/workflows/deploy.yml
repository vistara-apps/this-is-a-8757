name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install

    - name: Build application
      run: npm run build
      env:
        NODE_OPTIONS: --max-old-space-size=4096

    - name: Check Vercel Configuration
      run: |
        if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
          echo "⚠️ Vercel deployment skipped: VERCEL_TOKEN secret not configured"
          echo "To enable Vercel deployment, configure the following repository secrets:"
          echo "- VERCEL_TOKEN"
          echo "- VERCEL_ORG_ID" 
          echo "- VERCEL_PROJECT_ID"
        else
          echo "✅ Vercel secrets configured, deployment will proceed"
        fi
        
    - name: Run linter
      run: npm run lint
      continue-on-error: true
        
    - name: Comment PR with build status
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `✅ **Build Successful!**
            
            The Next.js Base Mini App has been successfully built and is ready for deployment.
            
            🔧 **Build Details:**
            - Framework: Next.js 14 with App Router
            - OnchainKit: Integrated for Base functionality
            - TypeScript: Enabled
            - Tailwind CSS: Configured
            
            To deploy this app, configure your deployment platform (Vercel, Netlify, etc.) with the appropriate environment variables.`
          });
